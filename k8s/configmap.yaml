# Settings for the app, handed to it as environment variables.
# Change a value here, re-apply, and restart the pods: no rebuild needed.
apiVersion: v1
kind: ConfigMap
metadata:
  name: sat-tracker-config
  namespace: sat-tracker
data:
  OBSERVER_NAME: "JMU, Harrisonburg VA"
  OBSERVER_LAT: "38.4351"
  OBSERVER_LON: "-78.8698"
  OBSERVER_ELEVATION_M: "400"
  MIN_ELEVATION_DEG: "10"
