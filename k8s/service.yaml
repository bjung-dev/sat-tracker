# One stable address in front of all sat-tracker pods. Traffic sent to
# port 80 of this Service is spread across the pods' port 8000.
apiVersion: v1
kind: Service
metadata:
  name: sat-tracker
  namespace: sat-tracker
spec:
  selector:
    app: sat-tracker
  ports:
    - name: http
      port: 80
      targetPort: http
