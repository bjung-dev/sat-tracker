apiVersion: v1
kind: Service
metadata:
  name: {{ include "sat-tracker.fullname" . }}
  labels:
    {{- include "sat-tracker.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "sat-tracker.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
