# Continuous Integration: on every push and pull request, GitHub spins up a
# fresh Linux machine and runs these jobs. Results show in the repo's
# "Actions" tab and as a ✓ or ✗ next to each commit.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# If you push again before a run finishes, cancel the outdated run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: jobs can only read the code unless they ask for more.
permissions:
  contents: read

# Every action below is pinned to an exact commit SHA (with the version as a
# comment). Tags like "v7" can be moved to different code by whoever controls
# the action; a SHA can't, which protects us from supply-chain attacks.

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
          enable-cache: true
      # --locked: fail if uv.lock is out of date, so CI tests exactly the
      # library versions we'll ship.
      - run: uv sync --locked
      - run: uv run pytest -v

  lint-chart:
    name: Lint Helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - run: helm lint charts/sat-tracker
      - run: helm lint charts/sat-tracker -f charts/sat-tracker/values-chantilly.yaml

  build:
    name: Build and publish image
    # Only build once the tests and chart checks have passed.
    needs: [test, lint-chart]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # allowed to upload images to GitHub's registry
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Pull requests only build (to prove the Dockerfile works); pushes to
      # main also log in and publish.
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Work out the image tags: "sha-abc1234" (the exact commit) on every
      # build, plus "latest" for builds of main.
      - name: Generate image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build (and push on main)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Reuse layers from previous runs to make builds faster.
          cache-from: type=gha
          cache-to: type=gha,mode=max
